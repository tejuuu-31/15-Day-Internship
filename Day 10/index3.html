<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
.active{
background-color: black;
color: rgb(11, 232, 232);
}
</style>
</head>
<body>

<button onclick="change()">Click me to change the background</button>

<script>
function change(){
document.querySelector("button").classList.toggle("active");
}
</script>
</body>
</html>
