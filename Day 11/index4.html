<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<script>
let fruits = ["Apple", "Orange", "PineApple"];
//Array Methods
//1. map --> It will transform each element frm the array
let upper = fruits.map(fruit => fruit.toUpperCase());
console.log(upper);

//2.filter-->It will keep the items that match the condition
let checkfruits = fruits.filter(fruit => fruit.includes("apple"));
console.log(checkfruits);//Pineapple

//3. find: find is going to give us the first item that matches the condition
let found = fruits.find(f => f === "Apple");
console.log(found);

//4.some : Does any item match? // it will give me the result true or false
let some = fruits.some(fruit => fruit === "Apple");
console.log(some);

//5.every : do all the items satisfy the condition or not
let every = fruits.every(fruit => fruit.length>2)
console.log(every);//true


</script>


</body>
</html>
